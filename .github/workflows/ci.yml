name: macOS build
on:
  push:
    branches: [nightly, stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: bash scripts/build.sh
      - run: python3 scripts/check-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Juice-Bar-macOS
          path: dist/
